<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>冰箱便利貼任務板｜3D 場景</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/fridge-3d.css">
</head>
<body data-view="room">
<button class="back" id="back">回到房間</button>
<div class="progress" id="progress" aria-label="任務進度"></div>
<div class="sound-control">
  <section class="sound-panel" id="sound-panel" aria-label="聲音設定" hidden>
    <label class="sound-row sound-switch">
      <span>聲音</span>
      <input type="checkbox" id="sound-enabled" role="switch" checked>
    </label>
    <label class="sound-row">
      <span>冰箱白噪音</span>
      <input type="range" id="hum-volume" min="0" max="100" step="1">
      <output id="hum-value" for="hum-volume"></output>
    </label>
    <label class="sound-row">
      <span>開關門音效</span>
      <input type="range" id="sfx-volume" min="0" max="100" step="1">
      <output id="sfx-value" for="sfx-volume"></output>
    </label>
  </section>
  <button class="sound" id="sound" aria-expanded="false" aria-controls="sound-panel">🔊</button>
</div>
<div class="hud"><div class="msg" id="msg" aria-live="polite"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="js/state.js"></script>
<script src="js/textures.js"></script>
<script src="js/geometry.js"></script>
<script src="js/postfx.js"></script>
<script src="js/scene.js"></script>
<script src="js/decor.js"></script>
<script src="js/interior.js"></script>
<script src="js/kitchen.js"></script>
<script src="js/audio.js"></script>
<script src="js/sound-panel.js"></script>
<script src="js/camera.js"></script>
<script src="js/ui.js"></script>
<script src="js/interactions.js"></script>
<script src="js/animation.js"></script>
<script src="js/sync-simulation.js"></script>
<script src="js/app.js"></script>
</body>
</html>
